name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # needed for softprops/action-gh-release on tag pushes

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            mexext: mexmaca64
            asset: blosc-matlab-macos-arm64
          - os: macos-13
            mexext: mexmaci64
            asset: blosc-matlab-macos-x64
          - os: ubuntu-24.04
            mexext: mexa64
            asset: blosc-matlab-linux-x64
          # Linux arm64 is disabled: matlab-actions/setup-matlab@v2 does
          # not yet support linux arm runners ("Error: This action is
          # not supported on linux runners using the arm64
          # architecture."). Users on ARM Linux can `build` locally from
          # source; re-add this row once setup-matlab grows arm support.
          # - os: ubuntu-24.04-arm
          #   mexext: mexa64
          #   asset: blosc-matlab-linux-arm64
          - os: windows-2022
            mexext: mexw64
            asset: blosc-matlab-windows-x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: R2024a

      - name: Build the MEX
        uses: matlab-actions/run-command@v2
        with:
          command: build

      - name: Run tests
        uses: matlab-actions/run-command@v2
        with:
          command: |
            addpath(pwd);
            results = runtests('tests', 'IncludeSubfolders', true);
            assertSuccess(results);

      - name: Stage release payload
        shell: bash
        run: |
          mkdir -p release/blosc-matlab/+blosc/private
          cp -r +blosc release/blosc-matlab/
          cp LICENSE README.md release/blosc-matlab/
          cp LICENSE-C-BLOSC release/blosc-matlab/ 2>/dev/null || true
          cd release
          tar czf ${{ matrix.asset }}.tar.gz blosc-matlab

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: release/${{ matrix.asset }}.tar.gz

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/${{ matrix.asset }}.tar.gz
